name: Chromium ZIP

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies and build Chromium extension
        run: |
          npm ci
          npm test -- --runInBand
          npm run build:prod
      - name: Package extension ZIP
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match package.json version $version" >&2
            exit 1
          fi
          archive="Surfingkeys-custom-chromium-${version}.zip"
          mkdir -p release
          rm -f dist/production/chrome/sk.zip
          python - "$archive" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("dist/production/chrome")
          archive = Path("release") / sys.argv[1]
          with ZipFile(archive, "w", ZIP_DEFLATED) as bundle:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      bundle.write(path, path.relative_to(source))
          with ZipFile(archive) as bundle:
              if "manifest.json" not in bundle.namelist():
                  raise SystemExit("the extension ZIP has no root manifest.json")
          PY
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: custom-chromium-extension
          path: release/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: custom-chromium-extension
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
